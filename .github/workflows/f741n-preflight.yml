name: DuyKhaiDeX Flip6 preflight tests

on:
  push:
    branches: [dk-f741n-oneui7-port]
  pull_request:
    paths:
      - 'scripts/preflight_f741n.py'
      - 'scripts/import_duykhaidex_f741n.py'
      - 'scripts/inspect_f741n_f956n_archives.py'
      - 'scripts/inspect_super_f741n_f956n.py'
      - 'scripts/plan_f741n_f956n_port.py'
      - 'scripts/extract_b6q_images.py'
      - 'scripts/verify_b6q_stage.py'
      - 'scripts/audit_b6q_framework.py'
      - 'scripts/report_b6q_dex_candidates.py'
      - 'scripts/stage_b6q_dex_assets.py'
      - 'scripts/stage_b6q_boot_chain.py'
      - 'scripts/analyze_b6q_avb.py'
      - 'scripts/inspect_b6q_bl_avb.py'
      - 'scripts/inspect_b6q_bl_vbmeta_chain.py'
      - 'scripts/audit_b6q_vintf_mounts.py'
      - 'scripts/diagnose_b6q_all.py'
      - 'scripts/b6q_fast_status.py'
      - 'scripts/run_b6q_checkvintf.py'
      - 'scripts/audit_b6q_vintf_contracts.py'
      - 'scripts/audit_b6q_avb_trust_graph.py'
      - 'scripts/triage_b6q_neverallow.py'
      - 'scripts/audit_b6q_boot_mount_gate.py'
      - 'scripts/inspect_b6q_stock_ramdisks.py'
      - 'scripts/compare_b6q_first_stage_fstab.py'
      - 'scripts/audit_b6q_selinux_inputs.py'
      - 'scripts/b6q_release_gate.py'
      - 'scripts/compile_b6q_selinux.py'
      - 'scripts/inspect_b6q_device_bootstate.py'
      - 'scripts/port_b6q.sh'
      - 'scripts/stage_b6q_flip5_source_kit.py'
      - 'scripts/build_super_b6q.sh'
      - 'scripts/build_b6q_engineering_ap.py'
      - 'scripts/apply_b6q_settings.sh'
      - 'scripts/adapt_b6q_settings_patches.py'
      - 'scripts/rebase_b6q_settings_gateway.py'
      - 'scripts/rebase_b6q_settings_count.py'
      - 'scripts/rebase_b6q_dex_zone_strings.py'
      - 'scripts/rebase_b6q_additive_strings.py'
      - 'target/b6q/config.sh'
      - 'target/b6q/patches/dex/customize.sh'
      - 'target/b6q/patches/dex/module.prop'
      - 'target/b6q/port-plan.json'
      - 'tests/test_f741n_preflight.py'
      - 'tests/test_b6q_flip5_source_kit.py'
      - 'tests/test_f741n_import_resume.py'
      - 'tests/test_f741n_archive_inspection.py'
      - 'tests/test_f741n_super_metadata.py'
      - 'tests/test_f741n_port_capacity.py'
      - 'tests/test_f741n_extraction.py'
      - 'tests/test_f741n_stage_verification.py'
      - 'tests/test_f741n_framework_audit.py'
      - 'tests/test_f741n_dex_report.py'
      - 'tests/test_f741n_dex_assets.py'
      - 'tests/test_f741n_boot_chain_staging.py'
      - 'tests/test_f741n_engineering_ap.py'
      - 'tests/test_f741n_avb_readiness.py'
      - 'tests/test_f741n_bl_avb_discovery.py'
      - 'tests/test_f741n_bl_vbmeta_chain.py'
      - 'tests/test_f741n_vintf_mount_triage.py'
      - 'tests/test_f741n_one_shot_diagnostics.py'
      - 'tests/test_f741n_fast_status.py'
      - 'tests/test_f741n_host_checkvintf.py'
      - 'tests/test_f741n_vintf_contracts.py'
      - 'tests/test_f741n_avb_trust_graph.py'
      - 'tests/test_f741n_neverallow_triage.py'
      - 'tests/test_f741n_boot_mount_gate.py'
      - 'tests/test_f741n_stock_ramdisk_inspection.py'
      - 'tests/test_f741n_first_stage_fstab_compare.py'
      - 'tests/test_f741n_selinux_inputs.py'
      - 'tests/test_f741n_release_gate.py'
      - 'tests/test_f741n_secilc_host_compile.py'
      - 'tests/test_f741n_adb_bootstate.py'
      - 'tests/test_f741n_settings_adapter.py'
      - 'tests/test_f741n_settings_gateway_rebase.py'
      - 'tests/test_f741n_settings_count_rebase.py'
      - 'tests/test_f741n_dex_zone_strings.py'
      - 'tests/test_f741n_additive_strings.py'
      - '.github/workflows/f741n-preflight.yml'
  workflow_dispatch:

jobs:
  validate-firmware-inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python preflight
        run: python3 -m py_compile scripts/preflight_f741n.py scripts/import_duykhaidex_f741n.py scripts/inspect_f741n_f956n_archives.py scripts/inspect_super_f741n_f956n.py scripts/plan_f741n_f956n_port.py scripts/extract_b6q_images.py scripts/verify_b6q_stage.py scripts/audit_b6q_framework.py scripts/report_b6q_dex_candidates.py scripts/stage_b6q_dex_assets.py scripts/stage_b6q_boot_chain.py scripts/analyze_b6q_avb.py scripts/inspect_b6q_bl_avb.py scripts/inspect_b6q_bl_vbmeta_chain.py scripts/audit_b6q_vintf_mounts.py scripts/diagnose_b6q_all.py scripts/b6q_fast_status.py scripts/run_b6q_checkvintf.py scripts/audit_b6q_vintf_contracts.py scripts/audit_b6q_avb_trust_graph.py scripts/triage_b6q_neverallow.py scripts/audit_b6q_boot_mount_gate.py scripts/inspect_b6q_stock_ramdisks.py scripts/compare_b6q_first_stage_fstab.py scripts/audit_b6q_selinux_inputs.py scripts/b6q_release_gate.py scripts/compile_b6q_selinux.py scripts/inspect_b6q_device_bootstate.py scripts/build_b6q_engineering_ap.py scripts/stage_b6q_flip5_source_kit.py scripts/adapt_b6q_settings_patches.py scripts/rebase_b6q_settings_gateway.py scripts/rebase_b6q_settings_count.py scripts/rebase_b6q_dex_zone_strings.py scripts/rebase_b6q_additive_strings.py tests/test_f741n_preflight.py tests/test_f741n_import_resume.py tests/test_f741n_archive_inspection.py tests/test_f741n_super_metadata.py tests/test_f741n_port_capacity.py tests/test_f741n_extraction.py tests/test_f741n_stage_verification.py tests/test_f741n_framework_audit.py tests/test_f741n_dex_report.py tests/test_f741n_dex_assets.py tests/test_f741n_boot_chain_staging.py tests/test_f741n_avb_readiness.py tests/test_f741n_bl_avb_discovery.py tests/test_f741n_vintf_mount_triage.py tests/test_f741n_one_shot_diagnostics.py tests/test_f741n_fast_status.py tests/test_f741n_host_checkvintf.py tests/test_f741n_vintf_contracts.py tests/test_f741n_avb_trust_graph.py tests/test_f741n_neverallow_triage.py tests/test_f741n_boot_mount_gate.py tests/test_f741n_stock_ramdisk_inspection.py tests/test_f741n_first_stage_fstab_compare.py tests/test_f741n_selinux_inputs.py tests/test_f741n_release_gate.py tests/test_f741n_secilc_host_compile.py tests/test_f741n_adb_bootstate.py tests/test_f741n_settings_adapter.py tests/test_f741n_settings_gateway_rebase.py tests/test_f741n_settings_count_rebase.py tests/test_f741n_dex_zone_strings.py tests/test_f741n_additive_strings.py
      - name: Test mixed model selection without firmware files
        run: python3 -m unittest discover -s tests -p 'test_f741n*.py' -v

      - name: Reuse original Flip5 DeX and KernelSU root source for Flip6
        run: |
          python3 -m unittest discover -s tests -p 'test_b6q_flip5_source_kit.py' -v
          python3 scripts/stage_b6q_flip5_source_kit.py --inspect
          python3 scripts/stage_b6q_flip5_source_kit.py --output "$RUNNER_TEMP/flip5-b6q-source-kit"
          test -f "$RUNNER_TEMP/flip5-b6q-source-kit/port-kit.json"
          test -f "$RUNNER_TEMP/flip5-b6q-source-kit/root/essential/module.prop"
          test -f "$RUNNER_TEMP/flip5-b6q-source-kit/dex/smali/system/framework/services.jar/0001-Add-external-display-refresh-policy.patch"
      - name: Test F741N Odin AP engineering packaging without real firmware
        run: |
          python3 -m unittest discover -s tests -p 'test_f741n_engineering_ap.py' -v
          python3 scripts/build_b6q_engineering_ap.py --help
      - name: Validate b6q direct port driver (same b5q module structure)
        run: |
          bash -n scripts/port_b6q.sh scripts/build_super_b6q.sh scripts/apply_b6q_settings.sh
          bash -n target/b6q/config.sh target/b6q/patches/dex/customize.sh
          bash scripts/port_b6q.sh --help
          bash scripts/build_super_b6q.sh --help
          bash scripts/apply_b6q_settings.sh --help
          python3 -m unittest discover -s tests -p 'test_f741n_settings_adapter.py' -v
          python3 -m unittest discover -s tests -p 'test_f741n_settings_gateway_rebase.py' -v
          python3 -m unittest discover -s tests -p 'test_f741n_settings_count_rebase.py' -v
          python3 -m unittest discover -s tests -p 'test_f741n_dex_zone_strings.py' -v
          python3 -m unittest discover -s tests -p 'test_f741n_additive_strings.py' -v
          python3 -m unittest discover -s tests -p 'test_f741n_boot_chain_staging.py' -v
          python3 -m unittest discover -s tests -p 'test_f741n_avb_readiness.py' -v
          python3 -m unittest discover -s tests -p 'test_f741n_bl_avb_discovery.py' -v
          grep -Fq 'rebase_b6q_additive_strings.py' scripts/apply_b6q_settings.sh
          grep -Fq 'rebase_b6q_dex_zone_strings.py' scripts/apply_b6q_settings.sh
          grep -Fq 'rebase_b6q_settings_count.py' scripts/apply_b6q_settings.sh
          test -f onigiri/mods/settings/smali/system/priv-app/SecSettings/SecSettings.apk/0001-Add-Onigiri-Settings.patch
          test -f onigiri/mods/settings/smali/system_ext/priv-app/SystemUI/SystemUI.apk/0001-Replace-the-no-SIM-carrier-text.patch
          # The upstream smali hooks must precede SamsungPropsHooks:
          test -f onigiri/mods/pif/smali/system/framework/framework.jar/0001-Introduce-PlayIntegrityHooks.patch
          test -f onigiri/mods/pif/smali/system/framework/framework.jar/0002-Introduce-KeyStoreHooks.patch
          test -f onigiri/mods/pif/smali/system/framework/services.jar/0001-Introduce-PlayIntegrityHooks.patch
          grep -Fq 'apply_one_target "$prereq" "$PIF_SRC" pif' scripts/apply_b6q_settings.sh
          test -f target/b5q/patches/dex/smali/system/framework/services.jar/0001-Add-external-display-refresh-policy.patch
          test -f target/b6q/patches/dex/customize.sh
