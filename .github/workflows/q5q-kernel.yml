name: Fold5 q5q kernel candidate
on:
  push:
    branches: [fold5-q5q-kernelsu]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y automake autoconf libtool pkg-config bc bison build-essential cpio dwarves flex gawk git kmod libelf-dev libssl-dev lz4 rsync zip zstd device-tree-compiler python3-pyelftools liblz4-dev libzstd-dev uuid-dev liblzma-dev libselinux1-dev
      - name: Prepare pinned KernelSU and compile q5q candidate
        run: |
          git submodule update --init --depth 1 external/kernel
          cd external/kernel
          git apply ../../external/patches/kernel/0001-build-official-kernelsu-and-susfs.patch
          grep -Fx 'export MODEL="b5q"' build.sh
          sed -i 's/^export MODEL="b5q"$/export MODEL="q5q"/' build.sh
          # Stop after native GKI and MSM build plus its config checks.
          sed -i '/^"\${SCRIPTS_DIR}\/build_vendor_boot.sh"/,$d' build.sh
          bash build.sh ksu oneui
      - uses: actions/upload-artifact@v4
        with:
          name: q5q-candidate-for-abi-verification
          include-hidden-files: true
          if-no-files-found: error
          path: |
            external/kernel/out/oneui/q5q/**/dist/Image
            external/kernel/out/oneui/q5q/**/Module.symvers
            external/kernel/out/oneui/q5q/**/.config
            external/kernel/out/oneui/q5q/**/dist/kernel.release
